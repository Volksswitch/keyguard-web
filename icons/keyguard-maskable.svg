<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Maskable app icon — source for keyguard-maskable-512.png.
       Same glyph as keyguard.svg, but the black plate is FULL-BLEED with no
       rounded corners: a maskable icon is cropped to whatever shape the
       platform wants (circle, squircle, rounded square), so the plate must
       reach every edge or the crop cuts into it.
       The keyguard itself is scaled to 80% about the centre so no crop can
       clip it: its corners sit 12.44 units from centre, inside the 12.8-unit
       safe radius. At full size those corners would be 15.56 units out and
       would be cut off — which is exactly what happens to an app that ships
       only the rounded variant.
       Public domain (CC0), as with the rest of this project. -->
  <rect width="32" height="32" fill="#000000"/>
  <rect x="7.2" y="7.2" width="17.6" height="17.6" rx="2.4" fill="#ffffff"/>
  <g fill="#000000">
    <rect x="9.6" y="9.6" width="5.4" height="5.4" rx="0.8"/>
    <rect x="17"  y="9.6" width="5.4" height="5.4" rx="0.8"/>
    <rect x="9.6" y="17"  width="5.4" height="5.4" rx="0.8"/>
    <rect x="17"  y="17"  width="5.4" height="5.4" rx="0.8"/>
  </g>
</svg>
